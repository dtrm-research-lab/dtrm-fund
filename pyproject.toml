[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dtrm-fund"
version = "0.1.0"
description = "Open-source research framework for DTRM Fund."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "xgboost>=2.0.0",
]

[project.optional-dependencies]
v5-builder = [
    "pymongo>=4.6,<5",
    "python-dotenv>=1.0,<2",
    "requests>=2.31,<3",
    "sentence-transformers>=3.0,<6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
