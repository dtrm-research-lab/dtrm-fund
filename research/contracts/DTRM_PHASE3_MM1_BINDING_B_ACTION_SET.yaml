binding:
  id: DTRM_PHASE3_MM1_BINDING_B_ACTION_SET
  phase: 3
  experiment: MM1
  component: admissible_action_set
  status: defined_action_space_objective_blocked
  parent_contract: DTRM_PHASE3_MINMAX_CONTRACT
  predecessor:
    action_binding: DTRM_PHASE3_BINDING_B_ACTION_SET
    negative_result: DTRM_PHASE3_MM0_INNER_ADVERSARY_DERIVATION

purpose: >
  Define a distinct MM1 action space after the frozen MM0 specification was
  shown analytically to be decision-theoretically dominated. MM1 preserves
  the Phase-2 eligible pool, Top-K cardinality, information state, champion
  fallback, value units, and frozen downside uncertainty family, while
  removing only the MM0 walk-down restriction that forced every challenger
  to remain a suffix replacement of the Phase-2 baseline ranking.

scientific_hypothesis_at_action_level: >
  Conditional on candidates already passing the promoted Phase-2 calibrated
  P10 guardrail, a robust decision layer may require freedom to choose a
  different full-K subset rather than being limited to additional vetoes
  followed by the original ranking walk-down rule.

frozen_inherited_objects:
  information_state:
    contract: DTRM_PHASE3_BINDING_A_ZT
    unchanged: true

  phase2_eligible_pool:
    symbol: E_H
    definition: >
      E_H = {i in H : calibrated_p10_i >= -0.16665692627429962}
    unchanged: true
    rescue_phase2_vetoed_candidates: forbidden

  topk:
    symbol: K_H
    formula: "K_H = int(n_H * 0.10)"
    unchanged: true

  phase2_champion:
    symbol: C_H = a_H^(2)
    definition: >
      First K_H Phase-2-eligible rows in descending frozen
      baseline_point_score order.
    role:
      - frozen_reference
      - mandatory_fallback
      - admissible_MM1_action
    unchanged: true

  value_space:
    contract: DTRM_PHASE3_BINDING_C_VALUE
    unit: frozen_phase2_target_model_units
    aggregation: arithmetic_mean
    unchanged_at_action_binding_stage: true

  uncertainty_family:
    family_contract: DTRM_PHASE3_MM0_UNCERTAINTY_FAMILY
    rho_contract: DTRM_PHASE3_MM0_RHO_FROZEN
    rho: 0.4378501384944031
    candidate_value_formula: "y_i(z) = b_i - z_i * d_i"
    stress_budget: "sum_i z_i <= 0.4378501384944031 * K_H"
    nominal_state_included: true
    unchanged_at_action_binding_stage: true

experimental_unit:
  unit: frozen_evaluation_cohort
  cohort_symbol: H
  note: >
    MM1 retains the same cohort-level selection benchmark used in Phase 2
    and MM0. It is not a claim that all K selected rows are simultaneous
    live portfolio positions.

mm1_action_representation:
  type: binary_selection_vector
  symbol: x_H

  per_candidate:
    domain: "x_i in {0,1}"
    interpretation:
      1: candidate is selected into the MM1 full-K action
      0: candidate is not selected

  constraints:
    phase2_eligibility: >
      x_i <= phase2_guardrail_pass_i for every row i
    exact_cardinality: >
      sum_i x_i = K_H

  selected_set:
    symbol: S_H(x)
    definition: "S_H(x) = {i in H : x_i = 1}"
    cardinality: "|S_H(x)| = K_H"

admissible_action_set:
  symbol: A_MM1(Z_H)
  definition: >
    A_MM1(Z_H) is the set of every exact-K_H subset of the frozen Phase-2
    eligible pool E_H.
  set_form: >
    A_MM1(Z_H) = {S subseteq E_H : |S| = K_H}

  difference_from_MM0: >
    MM0 required a challenger to be generated by additional vetoes followed
    by the frozen baseline ranking walk-down. MM1 removes that finalizer
    restriction. Candidate eligibility and K_H remain unchanged.

ranking_policy:
  phase2_baseline_rank:
    retained: true
    roles:
      - reproduce_phase2_champion
      - audit_provenance
      - deterministic_tie_break_if_later_preregistered
    role_in_MM1_admissibility: none

  replacement_predictive_ranking:
    allowed: false
    statement: >
      MM1 does not authorize training or introducing a new predictive score.
      The robust decision procedure may choose among already-approved rows,
      but no extra predictor, P50/P90 signal, historical model, or future
      information is introduced by this action contract.

fallback_identity:
  champion_indicator:
    formula: >
      x_i^C = 1 if i in C_H, else 0
  admissible: true
  exact_cardinality: true
  eligible_only: true
  consequence: >
    Phase 2 remains explicitly available as a no-change fallback in MM1.

nontriviality:
  combinatorial_condition: "|E_H| > K_H"
  implication: >
    When the eligible pool contains more than K_H rows, MM1 contains
    multiple exact-K_H subsets and therefore has genuine subset freedom.
  known_phase2_evidence:
    V2:
      eligible_rows: 2530
      K_H: 444
      combinatorially_nontrivial: true
    V3:
      eligible_rows: 1634
      K_H: 282
      combinatorially_nontrivial: true
    V4:
      eligible_rows: 23348
      K_H: 4032
      combinatorially_nontrivial: true

structural_consistency_check:
  status: FAIL_IF_INHERITING_MM0_INCREMENTAL_OBJECTIVE_UNCHANGED
  theorem: >
    Expanding the action set alone does not make positive baseline-relative
    worst-case improvement possible while the uncertainty set contains the
    nominal state z=0 and the Phase-2 champion is the top-K subset by
    baseline_point_score.

  proof:
    - >
      C_H contains the K_H highest baseline_point_score values among E_H.
    - >
      Therefore for every S in A_MM1(Z_H),
      sum_{i in S} b_i <= sum_{i in C_H} b_i.
    - >
      Hence DeltaV_H(S, z=0) <= 0 for every admissible S.
    - >
      Because z=0 belongs to the inherited uncertainty set,
      min_z DeltaV_H(S,z) <= DeltaV_H(S,0) <= 0.
    - >
      Thus the MM0 strict robust-improvement criterion cannot become
      positive merely by replacing the walk-down action space with all
      exact-K subsets.

  consequence: >
    MM1 action-space definition is valid and nontrivial, but the complete
    MM1 experiment remains blocked until a separately preregistered MM1
    robust decision objective is defined. The objective must not be chosen
    using Phase-3 holdout outcomes.

objective_boundary:
  current_MM0_incremental_objective:
    formula: >
      Gamma_incremental(S) = min_z [V_H(S,z) - V_H(C_H,z)]
    status_for_MM1: not_authorized_as_primary_MM1_objective
    reason: structural_nonpositivity_proved_above

  next_required_contract:
    id_placeholder: DTRM_PHASE3_MM1_BINDING_C_ROBUST_OBJECTIVE
    requirement: >
      Define the MM1 robust decision criterion before any MM1 optimizer is
      implemented. The criterion must preserve Phase-2 as an admissible
      fallback and retain ex-post comparison against the Phase-2 champion,
      while avoiding a mathematically impossible strict same-scenario
      dominance requirement.

  candidate_direction_for_next_contract_not_yet_authorized: >
    A standard robust-optimization candidate is to maximize each action's
    own worst-case value, max_S min_z V_H(S,z), with C_H included in the
    same feasible set, then evaluate the frozen chosen action ex post against
    C_H. This note records the natural mathematical direction only; it is not
    authorized by Binding B-MM1 and requires its own preregistration gate.

information_firewall:
  direct_decision_inputs:
    allowed:
      - fields_from_DTRM_PHASE3_BINDING_A_ZT
      - frozen_phase2_constants
      - frozen_rho_MM0
    forbidden:
      - target_model
      - realized_forward_returns
      - future_prices
      - phase3_holdout_results
      - p50
      - p90
      - raw_390_features_as_new_MM1_policy_inputs
      - transformer_embeddings
      - historical_analogue_outcomes

  holdout_outcome_inspection_before_objective_freeze: forbidden

invalid_MM1_actions:
  - selects_any_phase2_vetoed_candidate
  - selects_more_or_fewer_than_K_H_rows
  - changes_phase2_p10_threshold
  - changes_phase2_calibration
  - changes_phase2_models_or_iterations
  - changes_topk_fraction
  - uses_realized_outcomes_to_choose_subset
  - introduces_new_predictive_score_without_separate_preregistration

preservation_of_MM0_negative_result:
  required: true
  statement: >
    DTRM_PHASE3_MM0_INNER_ADVERSARY_DERIVATION remains a frozen negative
    theoretical result. MM1 is a new experiment and must not be described as
    a repair that retroactively changes MM0.

implementation_status:
  MM1_action_finalizer: blocked_until_MM1_objective_contract
  MM1_inner_adversary: not_rederived_here
  MM1_outer_optimizer: blocked
  phase3_holdout_evaluation: blocked

negative_result_policy:
  statement: >
    If the later fully preregistered MM1 robust objective still selects the
    Phase-2 champion or fails ex-post evaluation, that result is retained.
    No post-holdout relaxation of eligibility, K_H, rho, or objective rules
    is permitted.

gate_3_9_MM1_binding_B:
  status: PASS_FOR_ACTION_SPACE_ONLY
  permits:
    - derive_and_preregister_MM1_robust_objective
  does_not_permit:
    - implement_MM1_optimizer
    - inspect_phase3_holdout_outcomes
    - retune_rho
    - change_phase2_eligibility
    - introduce_p50_or_p90
    - introduce_historical_memory
    - introduce_transformer_extension
