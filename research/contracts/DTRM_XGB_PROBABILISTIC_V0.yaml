stage:
  id: DTRM_XGB_PROBABILISTIC_V0
  status: defined
  parent: DTRM_BASELINE_EXANTE_V0
  purpose: >
    Extend the validated ex-ante XGBoost baseline from
    point prediction to probabilistic return estimation.

hypothesis:
  statement: >
    Predicting the conditional distribution of forward returns
    provides more useful decision information than a single
    point estimate.

outputs:
  - p10
  - p50
  - p90

must_preserve:
  - ex-ante target definition
  - historical cohort dates
  - universe
  - train_validation_test_splits
  - embargo_days
  - ex-ante feature matrix
  - information available at decision time
  - evaluation methodology

baseline:
  id: DTRM_BASELINE_EXANTE_V0
  tag: dtrm-baseline-exante-v0

principle:
  - change prediction uncertainty, not information availability
  - compare against the frozen ex-ante baseline
  - no stage advances without measurable incremental value

validation:
  status: pending
  reproducible: true
  tests_passed: 114
  runner: research/experiments/run_probabilistic_xgb_v0.py

  quantile_models:
    p10:
      best_iteration: 18
      best_score: 0.02465790502590275
    p50:
      best_iteration: 19
      best_score: 0.05380345140186534
    p90:
      best_iteration: 0
      best_score: 0.02865654745966941

  calibration:
    method: weighted_validation_residual_offsets
    fitted_on: validation_only

    offsets:
      p10: -0.06494169682264328
      p50: -0.05668593570590019
      p90: 0.058683641254901886

    test:
      weighted_coverage_p10: 0.11934943403423799
      weighted_coverage_p50: 0.44923744497795326
      weighted_coverage_p90: 0.9396685491096511
      weighted_coverage_80_interval: 0.8203191150754132

      weighted_pinball_p10: 0.018568364903330803
      weighted_pinball_p50: 0.04700617119669914
      weighted_pinball_p90: 0.02591572515666485

      mean_interval_width: 0.3348904848098755
      crossing_rate: 0.0

  decision_value:
    methodology: top10pct_ranked_signal

    baseline_exante:
      validation:
        topk_mean: -0.023497406393289566
        topk_hit_rate: 0.2857142857142857
      test:
        topk_mean: 0.024929869920015335
        topk_hit_rate: 0.39637205712080276

    p10:
      selected_iteration: 10
      validation:
        topk_mean: -0.02310997247695923
        topk_hit_rate: 0.2962776659959759
      test:
        topk_mean: -0.03245527297258377
        topk_hit_rate: 0.3662678502508684

    p50:
      selected_iteration: 0
      validation:
        topk_mean: -0.017756586894392967
        topk_hit_rate: 0.4864185110663984
      test:
        topk_mean: -0.054749589413404465
        topk_hit_rate: 0.2848321111539946

    conclusion: >
      P10 improves materially over P50 on the held-out test,
      but neither probabilistic ranking signal demonstrates
      incremental decision value over the frozen ex-ante baseline.
      
  promotion:
    status: pending
    reason: >
      Probabilistic calibration generalizes out of sample,
      but incremental decision value versus the frozen
      ex-ante baseline has not yet been demonstrated.
