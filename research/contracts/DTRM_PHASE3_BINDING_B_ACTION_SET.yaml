binding:
  id: DTRM_PHASE3_BINDING_B_ACTION_SET
  phase: 3
  component: A_2
  status: defined
  parent_contract: DTRM_PHASE3_MINMAX_CONTRACT
  parent_binding: DTRM_PHASE3_BINDING_A_ZT
  purpose: >
    Bind the Phase-3 admissible action set to the exact selection
    semantics of the promoted Phase-2 guardrail while allowing a
    non-trivial adversarial challenger without changing the frozen
    baseline ranking or rescuing Phase-2-vetoed candidates.

scientific_isolation:
  principle: >
    MinMax MM0 is an additional robustness guardrail around the
    promoted Phase-2 champion, not a replacement ranking model.
  challenger_capability: >
    Phase 3 may impose an additional adversarial veto on candidates
    that already pass the frozen Phase-2 calibrated-P10 veto.
  challenger_forbidden:
    - reorder_candidates_with_a_new_score
    - rescue_phase2_vetoed_candidates
    - change_baseline_prediction
    - change_phase2_p10_veto
    - change_topk_fraction
    - change_phase2_fill_policy

phase2_executable_sources:
  primary_selection_reference: research/experiments/run_phase2_primary_bootstrap.py
  baseline_topk_reference: src/dtrm/topk_selection.py
  evaluation_reference: src/dtrm/evaluation.py
  promoted_guardrail_contract: research/contracts/DTRM_XGB_PROBABILISTIC_V2.yaml
  replication_contract: research/contracts/DTRM_XGB_PROBABILISTIC_V3.yaml
  robustness_contract: research/contracts/DTRM_XGB_PROBABILISTIC_V4.yaml

experimental_action_scope:
  unit: frozen_evaluation_cohort
  cohort_symbol: H
  note: >
    Phase-2 decision quality is evaluated by ranking all candidate rows
    in a frozen holdout cohort and selecting its Top-K rows. Therefore
    MM0 preserves that experimental unit for champion-versus-challenger
    comparability. It is a cohort-level selection benchmark, not a claim
    that all selected rows form one simultaneous live trading portfolio.

cohort:
  rows: n_H
  row_state: Z_(i,t)^MM0
  required_fields_from_binding_A:
    - news_id
    - ticker
    - date_dt
    - baseline_point_score
    - baseline_rank
    - calibrated_p10
    - phase2_guardrail_pass

  ordering:
    score: baseline_point_score
    direction: descending
    executable_semantics: numpy_argsort_negative_score
    reference: >
      np.argsort(-prediction), matching the frozen Phase-2 evaluator.

  topk:
    fraction: 0.10
    formula: K_H = int(n_H * 0.10)
    requirement: K_H > 0
    note: >
      This matches run_phase2_primary_bootstrap.py for the Phase-2
      statistical evidence cohorts. Existing Phase-2 cohorts are large
      enough that the max(1, ...) distinction in generic evaluation
      helpers is immaterial.

phase2_eligible_pool:
  symbol: E_H
  definition: >
    E_H = {i in H : phase2_guardrail_pass_i = true}
  equivalent_condition: >
    calibrated_p10_i >= -0.16665692627429962
  eligibility_is_frozen: true
  feasibility_condition: "|E_H| >= K_H"
  failure_rule: >
    If the frozen Phase-2 eligible pool cannot fill K_H, the cohort is
    infeasible for MM0 and no Phase-3 challenger result may be claimed.

phase2_champion_action:
  symbol: a_H^(2)
  construction:
    - sort all cohort rows by frozen baseline_point_score descending
    - retain only rows in E_H while preserving that frozen order
    - select the first K_H passing rows
  formula: >
    a_H^(2) = first_K_H(order_H intersect E_H)
  role:
    - frozen_champion
    - mandatory_fallback
    - admissible_action

phase3_action_representation:
  type: additional_veto_mask
  symbol: m_H
  per_row:
    domain: "m_i in {0,1}"
    interpretation:
      1: candidate remains available after the Phase-3 robustness check
      0: candidate receives an additional Phase-3 adversarial veto

  constraints:
    phase2_dominance: "m_i <= phase2_guardrail_pass_i for every i"
    meaning: >
      A candidate rejected by Phase 2 can never be recovered by MM0.
    full_topk_feasibility: "sum_i(m_i) >= K_H"
    meaning_full_topk: >
      Any proposed challenger action must leave enough candidates to
      construct the same full Top-K required by Phase 2.

phase3_action_finalizer:
  frozen_fill_policy: true
  construction:
    - take the frozen baseline ranking order
    - retain rows with m_i = 1
    - select the first K_H retained rows
  selected_set_symbol: S_H(m_H)
  formula: >
    S_H(m_H) = first_K_H({i in order_H : m_i = 1})
  cardinality: "|S_H(m_H)| = K_H"

admissible_action_set:
  symbol: A_2(Z_H)
  definition: >
    A_2(Z_H) is the set of all full-K selection outcomes S_H(m_H)
    generated by binary additional-veto masks satisfying
    m_i <= phase2_guardrail_pass_i and sum_i(m_i) >= K_H, while the
    original baseline ranking and fill policy remain frozen.

  equivalent_selected_set_properties:
    - every_selected_candidate_is_in_E_H
    - selected_set_has_exactly_K_H_rows
    - selected_order_is_inherited_from_frozen_baseline_ranking
    - no_phase2_rejected_candidate_can_appear

fallback_identity:
  no_additional_veto_mask:
    formula: "m_i = phase2_guardrail_pass_i for every i"
    result: "S_H(m_H) = a_H^(2)"
  consequence: >
    The frozen Phase-2 champion is explicitly embedded inside the
    Phase-3 admissible action set, so doing nothing remains a valid
    challenger action.

nontriviality:
  condition: "|E_H| > K_H"
  interpretation: >
    If more candidates pass the Phase-2 veto than are needed for Top-K,
    Phase 3 can reject some otherwise-admissible candidates and walk
    further down the same frozen ranking. This creates a genuine action
    space without introducing a replacement ranking.
  phase2_evidence:
    V2:
      holdout_rows: 4449
      K_H: 444
      phase2_pass_rows: 2530
      nontrivial: true
    V3:
      holdout_rows: 2827
      K_H: 282
      phase2_pass_rows: 1634
      nontrivial: true
    V4:
      holdout_rows: 40320
      K_H: 4032
      phase2_pass_rows: 23348
      nontrivial: true

invalid_actions:
  - selects_any_phase2_vetoed_candidate
  - leaves_fewer_than_K_H_candidates
  - changes_K_H
  - changes_baseline_order
  - uses_realized_future_target_to_choose_mask
  - uses_phase3_holdout_outcomes_to_choose_mask
  - changes_phase2_threshold
  - changes_phase2_calibration
  - changes_phase2_model_iterations

outcome_information:
  accessible_when_constructing_action: false
  prohibited_fields:
    - target_model
    - forward_excess_beta_target
    - realized_forward_returns
    - future_price_path
    - topk_mean_excess_beta
    - topk_hit_rate
  note: >
    Outcome variables are used only after an action has been frozen,
    for ex-post champion-versus-challenger evaluation.

implementation_binding:
  status: pending_adapter
  required_functional_interface: >
    A deterministic Phase-3 action finalizer must accept a frozen
    cohort state and an additional-veto mask, verify all admissibility
    constraints, and return exactly K_H selected row identities in the
    frozen baseline order.
  required_equivalence_test: >
    Passing the no-additional-veto mask must reproduce the exact
    Phase-2 champion selection for V2, V3, and V4.
  no_minmax_logic_yet: true

gate_3_2_binding_B:
  status: pass_for_definition
  permits:
    - binding_C_decision_value
    - deterministic_action_finalizer_design
  does_not_permit:
    - adversarial_scenario_definition
    - minmax_optimization
    - phase3_holdout_outcome_inspection
    - transformer_event_extension
