stage:
  id: DTRM_XGB_PROBABILISTIC_V2
  status: defined
  parent: DTRM_XGB_PROBABILISTIC_V1

purpose: >
  Test whether calibrated probabilistic downside information
  adds decision value when used as a relative risk veto around
  the frozen ex-ante baseline ranking.

hypothesis:
  statement: >
    Preserving the frozen ex-ante ranking while rejecting
    candidates whose calibrated P10 falls below the 25th
    percentile of the frozen V0 validation P10 distribution
    improves selection quality versus the ex-ante baseline alone.

frozen_inputs:
  baseline_tag: dtrm-baseline-exante-v0
  probabilistic_tag: dtrm-xgb-probabilistic-v0
  previous_experiment_tag: dtrm-xgb-probabilistic-v1

holdout:
  status: frozen
  start: 2026-06-07T00:30:00Z
  end: 2026-06-10T23:09:25Z

  structural_validation:
    unique_news: 575
    pairs: 4449
    canonical_tickers: 108
    duplicate_pairs: 0
    topk_rows: 444

  ticker_normalization:
    BRK.B: BRK-B

  price_snapshot:
    suffix: 2026-08-10
    assets_including_spy: 174

  target_observability:
    observable_pairs: 4449
    missing_pairs: 0
    horizon_days: 60
    price_tolerance_days: 5

  outcomes_inspected: true

decision_rule:
  ranking: frozen_exante_point_prediction
  veto_reference: frozen_v0_validation_calibrated_p10
  veto_percentile: 0.25
  topk_fraction: 0.10
  threshold_must_be_frozen_before_new_holdout: true
  fill_policy: >
    Walk down the frozen baseline ranking and select only
    candidates whose calibrated P10 is greater than or equal
    to the frozen threshold until Top-K is filled.

  veto_threshold_estimation:
    distribution: frozen_v0_validation_calibrated_p10
    estimator: weighted_empirical_quantile
    weights: legacy_news_weights
    quantile: 0.25
    fitted_on: validation_only
    validation_rows: 19880
    p10_best_iteration: 18
    calibration_offset: -0.06494169682264328
    frozen_threshold: -0.16665692627429962

feasibility:
  status: passed
  holdout_rows: 4449
  required_topk_rows: 444
  calibrated_p10_pass_rows: 2530
  pass_rate: 0.568667116205889
  can_fill_topk: true
  outcome_independent: true

evaluation:
  v0_test_status: consumed
  v1_holdout_status: consumed_for_feasibility
  holdout_requirement: new_untouched_temporal_cohort
  threshold_tuning_after_holdout: forbidden

  primary_metric: topk_mean_excess_beta

  comparison:
    baseline: frozen_exante_point_ranking
    candidate: frozen_exante_point_ranking_with_relative_p10_veto
    same_holdout: true
    same_topk_fraction: true

  promotion_criterion:
    require_full_topk: true
    minimum_delta_topk_mean: 0.0
    rule: >
      Promote only if candidate topk_mean_excess_beta is
      strictly greater than baseline topk_mean_excess_beta.

  secondary_metrics:
    - topk_hit_rate

  result:
    holdout_rows: 4449
    topk_rows: 444

    baseline_topk_mean: -0.1949552297592163
    candidate_topk_mean: -0.050660423934459686
    delta_topk_mean: 0.14429480582475662

    baseline_topk_hit_rate: 0.04504504504504504
    candidate_topk_hit_rate: 0.6238738738738738
    delta_topk_hit_rate: 0.5788288288288288

    promotion_criterion_met: true

promotion:
  status: promoted
  reason: >
    The preregistered relative calibrated-P10 veto improves
    Top-K mean versus the frozen ex-ante baseline on the
    untouched V2 holdout without threshold retuning.
