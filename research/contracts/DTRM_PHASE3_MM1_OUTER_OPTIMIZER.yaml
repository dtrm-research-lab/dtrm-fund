stage:
  id: DTRM_PHASE3_MM1_OUTER_OPTIMIZER
  phase: 3
  experiment: MM1
  component: outer_robust_optimizer
  status: defined_implementation_pending
  parent_action_binding: DTRM_PHASE3_MM1_BINDING_B_ACTION_SET
  parent_objective_binding: DTRM_PHASE3_MM1_BINDING_C_ROBUST_OBJECTIVE
  robust_value_adapter: src/dtrm/phase3_mm1_robust_value.py

purpose: >
  Preregister an exact deterministic outer optimization procedure for MM1
  before implementation and before any Phase-3 holdout outcome is inspected.
  The optimizer must maximize the frozen own-worst-case value W_H(S) over
  every exact-K subset of the frozen Phase-2 eligible pool, preserve the
  Phase-2 champion fallback, and implement the already-frozen tie hierarchy.

frozen_inputs:
  eligible_pool:
    symbol: E_H
    rule: phase2_guardrail_pass_is_true
    rescue_phase2_vetoed_candidates: forbidden

  cardinality:
    symbol: K_H
    formula: "K_H = int(n_H * 0.10)"

  per_candidate:
    nominal:
      symbol: b_i
      source: baseline_point_score
    downside_floor:
      symbol: l_i
      formula: "l_i = min(b_i, calibrated_p10_i)"
    downside_width:
      symbol: d_i
      formula: "d_i = b_i - l_i >= 0"

  uncertainty_budget:
    rho: 0.4378501384944031
    symbol: B_H
    formula: "B_H = rho * K_H"

  champion:
    symbol: C_H
    definition: >
      The first K_H eligible rows in descending frozen baseline_point_score
      order, exactly reproducing the Phase-2 promoted guardrail.

primary_problem:
  action_variables:
    symbol: x_i
    domain: binary
    scope: "i in E_H"
    selected_if: "x_i = 1"

  cardinality_constraint: "sum_{i in E_H} x_i = K_H"

  robust_objective:
    selected_set: "S(x) = {i in E_H : x_i = 1}"
    formula: >
      maximize W_H(S(x)) = min_{z in U_rho(Z_H)} V_H(S(x), z)

exact_robust_counterpart:
  derivation:
    inner_penalty_primal: >
      P(x) = max_z sum_i d_i x_i z_i
      subject to 0 <= z_i <= 1 and sum_i z_i <= B_H.

    inner_penalty_dual: >
      P(x) = min_{theta,p} B_H * theta + sum_i p_i
      subject to theta + p_i >= d_i x_i,
      theta >= 0, p_i >= 0.

    exactness_reason: >
      For fixed binary x the inner adversary is a feasible bounded linear
      program, so strong LP duality applies. Substituting its dual into the
      outer maximization yields an exact mixed-integer linear robust
      counterpart; no scenario enumeration or approximation is introduced.

  variables:
    x_i:
      type: binary
      bounds: "0 <= x_i <= 1"
    theta:
      type: continuous
      lower_bound: 0
    p_i:
      type: continuous
      lower_bound: 0

  constraints:
    - "sum_i x_i = K_H"
    - "theta + p_i >= d_i * x_i for every i in E_H"

  total_objective_symbol: J_H
  total_objective: >
    maximize J_H = sum_i b_i x_i - B_H * theta - sum_i p_i

  relationship_to_mean_robust_value: >
    W_H(S) = J_H / K_H at the optimum for a fixed selected set. Since K_H
    is frozen, maximizing J_H is exactly equivalent to maximizing W_H.

  terminology: >
    This is a max-min robust optimization problem. No minimax equality or
    interchange of max and min beyond the valid LP dualization of the fixed-x
    continuous inner adversary is claimed.

implementation_solver:
  primary_library: scipy.optimize.milp
  backend: HiGHS
  dependency_requirement: "scipy>=1.11"
  optimization_direction_in_api: >
    scipy.optimize.milp minimizes, so implementation minimizes the negative
    robust objective: -sum_i b_i x_i + B_H*theta + sum_i p_i.

  required_options:
    presolve: true
    mip_rel_gap: 0.0
    time_limit: none
    node_limit: none

  required_success_state:
    success: true
    status: optimal
    mip_gap: zero_or_solver_reported_numerical_zero

  failure_rule: >
    If the solver does not report an optimal solution, MM1 produces no
    challenger action for that cohort. The implementation must not accept an
    incumbent, relax the MIP gap, shorten the problem, or fall back to a
    heuristic and label it as the primary MM1 result.

authoritative_postsolve_validation:
  selected_indices:
    - exactly_K_H_rows
    - every_row_is_phase2_eligible
    - no_duplicates

  robust_value_recalculation:
    function: robust_value_for_selection
    source: src/dtrm/phase3_mm1_robust_value.py
    authoritative: true
    rule: >
      The selected subset's reported W_H is always recomputed with the
      independently tested exact fractional-knapsack adapter. Solver-native
      theta, p_i, and objective values are diagnostics, not the reported
      scientific robust value.

  champion_value:
    rule: >
      W_H(C_H) is computed with the same robust_value_for_selection adapter,
      never with a separate formula or a solver-only value.

intervention_gate:
  mean_value_tolerance: 1.0e-12
  source: DTRM_PHASE3_MM1_BINDING_C_ROBUST_OBJECTIVE

  primary_rule: >
    If W_star <= W_H(C_H) + 1e-12, return C_H exactly.

  challenger_rule: >
    A non-champion selection is permitted only when its recomputed exact
    robust value W_star exceeds W_H(C_H) by more than 1e-12.

  tolerance_is_economic_threshold: false
  tolerance_role: floating_point_only

tie_hierarchy:
  scope: >
    Applies only after a non-champion intervention has passed the champion
    fallback gate and there are multiple actions whose robust value is within
    1e-12 of the global maximum W_star.

  level_1_primary_band:
    requirement: "W_H(S) >= W_star - 1e-12"
    implementation_equivalent_total_bound: >
      J_H >= K_H * (W_star - 1e-12).

  level_2_overlap:
    objective: "maximize |S intersect C_H|"
    rule: >
      Solve a second exact MILP over the frozen primary robust-value band and
      retain the maximum champion-overlap cardinality.

  level_3_nominal_mean:
    objective: "maximize (1/K_H) * sum_{i in S} b_i"
    rule: >
      With the robust-value band and maximum overlap fixed, solve a third
      exact MILP maximizing nominal total sum_i b_i x_i.
    numerical_comparison_tolerance_mean_units: 1.0e-12
    note: >
      This tolerance is used only to encode floating-point equality around
      the solver-reported optimum of the already-frozen nominal tie level; it
      is not a new economic or promotion threshold.

  level_4_lexicographic_baseline_rank:
    objective: >
      Choose the lexicographically smallest tuple of sorted frozen
      baseline_rank values among all actions surviving levels 1-3.
    exact_procedure: >
      Process eligible rows in ascending frozen baseline_rank. At each row,
      test whether a feasible completion exists with that row included while
      preserving the robust band, maximum overlap, nominal-mean optimum band,
      exact K_H cardinality, and all earlier lexicographic fixes. If feasible,
      fix x_i=1; otherwise fix x_i=0. Stop once K_H rows are fixed selected.
    weighted_rank_surrogate: forbidden
    rationale: >
      A simple sum of ranks is not equivalent to lexicographic ordering. The
      sequential feasibility procedure implements the preregistered rule
      exactly and is invoked only in the residual tie case.

  outcome_data_used: false

independent_correctness_tests_required_before_evaluation:
  small_problem_exhaustive_outer_test:
    requirement: >
      For multiple synthetic eligible pools small enough to enumerate all
      exact-K subsets, compare the MILP-selected robust optimum against full
      combinatorial enumeration using robust_value_for_selection.
    must_match:
      - maximum_robust_value
      - champion_fallback_behavior
      - selected_action_after_tie_hierarchy

  inner_outer_consistency_test:
    requirement: >
      Recomputed robust_value_for_selection on the MILP selection must equal
      the maximum robust value obtained by exhaustive enumeration on every
      small verification problem within the frozen numerical tolerance.

  champion_embedding_test:
    requirement: >
      The exact Phase-2 champion must always be feasible in the MM1 MILP and
      the optimizer's maximum robust value must never be below W_H(C_H)
      beyond floating-point tolerance.

  eligibility_test:
    requirement: >
      No selected action may contain a Phase-2-vetoed row even in synthetic
      cases where such a row would otherwise have attractive b_i or d_i.

  determinism_test:
    requirement: >
      Repeated optimization of the same synthetic state must return the same
      final subset after the frozen tie hierarchy.

complexity_and_scaling:
  exhaustive_subset_search: forbidden_for_primary
  scenario_enumeration: not_required
  primary_method: exact_MILP_robust_counterpart
  note: >
    Phase-2 evidence cohorts contain thousands to tens of thousands of
    eligible rows, making direct subset enumeration scientifically
    unnecessary and computationally inappropriate. The robust counterpart
    keeps one binary selection variable and one non-negative dual slack per
    eligible row plus a single shared theta variable.

information_firewall:
  allowed:
    - fields_from_DTRM_PHASE3_BINDING_A_ZT
    - phase2_guardrail_pass
    - baseline_rank
    - frozen_K_H
    - frozen_rho_MM0
    - frozen_phase2_champion_identity

  forbidden:
    - target_model
    - realized_forward_returns
    - future_prices
    - phase3_holdout_metrics
    - p50
    - p90
    - raw_390_features_as_new_policy_inputs
    - historical_analogue_outcomes
    - transformer_embeddings

  phase3_holdout_outcome_inspection: forbidden

output_contract_for_later_implementation:
  required_fields:
    - selected_indices
    - champion_indices
    - k
    - eligible_rows
    - robust_value_selected
    - robust_value_champion
    - robust_lift
    - nominal_mean_selected
    - nominal_mean_champion
    - overlap_with_champion
    - intervention
    - solver_status
    - solver_mip_gap
    - scipy_version
    - numpy_version

  prohibited_fields_before_evaluation_gate:
    - realized_target_model_mean
    - realized_delta_vs_champion
    - realized_hit_rate
    - promotion_decision

negative_result_policy:
  statement: >
    If the exact optimizer returns the Phase-2 champion, or if its best robust
    value fails the frozen intervention tolerance, that is retained as the
    MM1 ex-ante result. rho, eligibility, K_H, objective, solver gap, and tie
    rules must not be altered to force an intervention.

implementation_gate:
  outer_optimizer_code: permitted
  outer_optimizer_unit_tests: required
  pyproject_scipy_dependency_update: permitted
  phase3_holdout_evaluation: blocked
  evaluation_runner: blocked
  historical_event_extension: blocked

next_required_step: >
  Implement the exact MILP outer optimizer and the required synthetic
  exhaustive-equivalence tests. Only after those tests pass may an MM1
  evaluation contract be preregistered; no Phase-3 holdout outcome may be
  inspected before that evaluation contract is frozen.

gate_3_11_MM1_outer_optimizer:
  status: PASS_FOR_IMPLEMENTATION_ONLY
  permits:
    - implement_exact_MM1_MILP_optimizer
    - add_scipy_dependency
    - unit_test_against_exhaustive_small_problems
  does_not_permit:
    - inspect_phase3_holdout_outcomes
    - run_MM1_on_phase3_evaluation_cohorts
    - retune_rho
    - change_phase2_eligibility
    - alter_primary_objective
    - historical_event_extension
