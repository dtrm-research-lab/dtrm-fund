stage:
  id: DTRM_XGB_PROBABILISTIC_V4
  status: defined
  parent: DTRM_XGB_PROBABILISTIC_V3

purpose: >
  Test the robustness of the frozen V2/V3 relative calibrated-P10
  veto on a substantially longer temporal cohort whose outcomes
  have never been inspected.

hypothesis:
  statement: >
    Preserving the frozen ex-ante point ranking while applying
    the unchanged relative calibrated-P10 veto improves Top-K
    decision quality versus the frozen ex-ante baseline on the
    previously outcome-uninspected V1 temporal cohort.

frozen_inputs:
  baseline_tag: dtrm-baseline-exante-v0
  probabilistic_tag: dtrm-xgb-probabilistic-v0
  decision_rule_source_tag: dtrm-xgb-probabilistic-v2
  replication_tag: dtrm-xgb-probabilistic-v3

holdout:
  status: preregistered
  source: DTRM_XGB_PROBABILISTIC_V1

  start: 2026-05-02
  end: 2026-06-06

  rationale: >
    This cohort is materially longer than V2 and V3 and its
    outcomes were not inspected during V1, which was closed
    outcome-independently on feasibility of a different absolute
    P10 rule.

  outcomes_inspected: true

decision_rule:
  ranking: frozen_exante_point_prediction
  topk_fraction: 0.10

  fill_policy: >
    Walk down the frozen baseline ranking and select only
    candidates whose calibrated P10 is greater than or equal
    to the frozen threshold until Top-K is filled.

  veto_threshold:
    p10_best_iteration: 18
    calibration_offset: -0.06494169682264328
    frozen_threshold: -0.16665692627429962

  threshold_tuning: forbidden
  model_retraining: forbidden
  rule_changes_after_holdout: forbidden

artifact_commitments:
  purpose: >
    Cryptographically commit the reused V1 artifacts before
    V4 outcome inspection. Target files were hashed without
    reading or evaluating their contents.

  probabilistic_v1_holdout_beta_pre_2026-06-06.pkl:
    sha256: e39896db92f1bb7c8334f61a6eee7bc71f8acbd6b6e87504c388ae0b8b1463d8

  probabilistic_v1_holdout_features_2026-06-06.npy:
    sha256: a75af139bab4768740eb2e96c8656e51910ce0eb240babd357c7e96150b9d750

  probabilistic_v1_holdout_signals_2026-06-06.pkl:
    sha256: dc6f2c7ce6e794c271864526c94e9709c2837129b4776f298a9487641a8ea76b

  probabilistic_v1_holdout_targets_2026-06-06.pkl:
    sha256: a48dc970761d0474e4bb856fed892b5ffa5a908afec4d54f938ea5ab4ed89cdf

  probabilistic_v1_holdout_model_targets_2026-06-06.pkl:
    sha256: 8c1ad175aa9c54a81134109f0a6459ee892d365f77f6489f379d49941b262121

feasibility:
  status: passed
  holdout_rows: 40320
  required_topk_rows: 4032
  calibrated_p10_pass_rows: 23348
  pass_rate: 0.5790674603174604
  can_fill_topk: true
  outcome_independent: true

evaluation:
  primary_metric: topk_mean_excess_beta

  promotion_criterion:
    require_full_topk: true
    rule: >
      Robustness succeeds only if candidate topk_mean_excess_beta
      is strictly greater than baseline topk_mean_excess_beta.

  secondary_metrics:
    - topk_hit_rate

  paper_evidence:
    objective: >
      Determine whether the V2/V3 effect persists over a materially
      longer outcome-uninspected temporal cohort.
    no_requirement_for_absolute_positive_return: true

  result:
    holdout_rows: 40320
    topk_rows: 4032

    baseline_topk_mean: -0.05458883196115494
    candidate_topk_mean: -0.02702723816037178
    delta_topk_mean: 0.027561593800783157

    baseline_topk_hit_rate: 0.3864087301587302
    candidate_topk_hit_rate: 0.4880952380952381
    delta_topk_hit_rate: 0.10168650793650791

    promotion_criterion_met: true

promotion:
  status: promoted
  reason: >
    The frozen V2/V3 relative calibrated-P10 veto improves
    Top-K decision quality versus the frozen ex-ante baseline
    on the substantially longer outcome-uninspected V1 cohort
    without retraining, threshold tuning, or rule changes.
