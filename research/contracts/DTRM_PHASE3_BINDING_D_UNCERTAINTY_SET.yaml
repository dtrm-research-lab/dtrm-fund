binding:
  id: DTRM_PHASE3_BINDING_D_UNCERTAINTY_SET
  phase: 3
  component: U
  status: defined_structural_only
  parent_contract: DTRM_PHASE3_MINMAX_CONTRACT
  parent_bindings:
    - DTRM_PHASE3_BINDING_A_ZT
    - DTRM_PHASE3_BINDING_B_ACTION_SET
    - DTRM_PHASE3_BINDING_C_VALUE
  purpose: >
    Define the admissibility contract for the Phase-3 uncertainty set
    before any concrete adversarial scenario, shock magnitude, regime,
    historical analogue, simulation rule, or learned event mechanism is
    selected.

scientific_role:
  principle: >
    The uncertainty set must represent plausible adverse realizations
    that could challenge the frozen Phase-2 decision using only
    information legitimately available under the Phase-3 data-access
    policy. It must not be an unconstrained mechanism for manufacturing
    a bad outcome for the challenger.
  objective: >
    Preserve a falsifiable distinction between adversarial robustness
    and retrospective outcome fitting.

notation:
  cohort: H
  frozen_information_state: Z_H
  uncertainty_set: U(Z_H)
  scenario: u
  candidate_scenario_value_vector: y(u)
  candidate_value: y_i(u)
  value_function: V_H(a,u)
  incremental_value: DeltaV_H(a,u)
  robust_margin: Gamma_H(a)

uncertainty_set_definition:
  abstract_form: >
    U(Z_H) is a non-empty set of admissible complete candidate-level
    value vectors y(u), generated by a preregistered scenario-construction
    rule using only approved information sources.
  complete_vector_requirement: >
    Every scenario u must define a finite value y_i(u) for every row that
    may appear in any admissible Phase-3 action for cohort H.
  target_space: frozen_phase2_target_model_units
  probability_measure_required: false
  probability_weighting_in_mm0: forbidden

adversary_semantics:
  adversary_chooses: one_admissible_scenario_u
  after_action_specific_tailoring: forbidden
  statement: >
    A scenario is a complete world that exists independently of the
    action being evaluated. The adversary may choose the worst admissible
    world for an action, but may not construct or alter that world after
    seeing which candidates the action selected.

  action_independence:
    required: true
    construction_rule_may_use_action: false
    construction_rule_may_use_selected_indices: false
    construction_rule_may_use_challenger_mask: false
    rationale: >
      Allowing scenario construction to depend on the chosen action would
      let the adversary target the challenger mechanically and would break
      champion-versus-challenger comparability.

same_world_comparison:
  required: true
  statement: >
    For each u, champion and challenger are evaluated using the same
    candidate-level scenario vector y(u), as required by Binding C.

information_policy:
  application_time_inputs:
    allowed_direct_inputs:
      - fields_authorized_by_DTRM_PHASE3_BINDING_A_ZT
      - frozen_phase2_constants
      - preregistered_uncertainty_parameters
    forbidden_direct_inputs:
      - phase3_evaluation_target_model
      - phase3_evaluation_forward_returns
      - phase3_evaluation_future_prices
      - phase3_evaluation_topk_metrics
      - phase3_evaluation_promotion_results

  scenario_design_reference_data:
    status: must_be_explicitly_frozen_before_instantiation
    permitted_in_principle: true
    rule: >
      A later scenario-instantiation contract may use historical reference
      data, including historically observed outcomes, only if that reference
      set is explicitly declared, temporally legitimate for the experiment,
      and disjoint from the Phase-3 evaluation outcomes used to test the
      frozen challenger.
    required_metadata:
      - source_artifact_or_dataset
      - observation_window
      - outcome_observability_cutoff
      - relationship_to_phase3_evaluation_cohort
      - feature_or_signal_fields_used
      - transformation_rule
      - frozen_hash_or_version_where_practical

  leakage_rule: >
    No information whose realization occurs after the relevant Phase-3
    decision time may influence scenario construction for that decision,
    unless it belongs to a previously frozen historical reference sample
    whose outcomes were already observable before the evaluation decision.

reference_evaluation_separation:
  required: true
  principle: >
    Data used to design or calibrate U and data used to evaluate the
    resulting Phase-3 challenger must be separated before outcome
    inspection of the evaluation cohort.
  evaluation_outcome_reuse_for_tuning: forbidden
  retuning_after_holdout: forbidden

boundedness:
  required: true
  reason: >
    An unconstrained adversary could send scenario values to negative
    infinity, making Gamma meaningless and forcing the fallback action
    mechanically.
  requirements:
    - every_y_i_u_is_finite
    - scenario_value_domain_is_predeclared
    - any_lower_or_upper_envelope_is_frozen_before_evaluation
    - no_post_outcome_expansion_of_adverse_bounds
  numerical_bounds: intentionally_not_defined_here

nonemptiness:
  required: true
  formula: "|U(Z_H)| >= 1"
  failure_rule: >
    If no admissible scenarios can be generated under the frozen rules,
    MM0 is infeasible for that cohort and no robust-improvement claim may
    be made.

cross_candidate_coherence:
  required: true
  principle: >
    A scenario is a joint cross-sectional realization, not an independent
    worst value chosen separately for every selected candidate after the
    action is known.
  consequence: >
    Any candidate-level perturbations, residuals, historical analogues,
    or learned states used later must be generated under one common
    scenario identifier u and a frozen joint-construction rule.
  independent_per_candidate_worst_case_without_joint_rule: forbidden

candidate_coverage:
  required_pool: phase2_eligible_pool_E_H
  minimum_requirement: >
    Every i in E_H must receive y_i(u) under every admissible u because
    Binding B permits any Phase-2-eligible row to enter a full-K challenger
    action after additional vetoes are applied.
  optional_coverage: all_rows_in_H
  phase2_vetoed_candidate_values_required_for_mm0: false

value_consistency:
  source_binding: DTRM_PHASE3_BINDING_C_VALUE
  required_unit: frozen_phase2_target_model_units
  arithmetic_mean_value_function_unchanged: true
  same_K_H: true
  target_scale_mixing: forbidden
  raw_return_only_scenarios: forbidden_unless_transformed_to_bound_value_space

plausibility_requirement:
  required: true
  statement: >
    Admissible scenarios must have a declared empirical, probabilistic,
    structural, or model-based justification. 'Adverse' alone is not a
    scientific admissibility criterion.
  acceptable_future_provenance_classes:
    - frozen_probabilistic_signal_derived
    - frozen_historical_empirical_reference
    - preregistered_residual_or_error_model
    - preregistered_structural_stress_model
    - learned_historical_event_representation
  note: >
    Listing a provenance class here does not authorize its use. Each
    concrete method requires a later instantiation contract and gate.

severity_governance:
  severity_parameter_required_if_applicable: true
  parameter_values_defined_here: false
  selection_rule: >
    Any severity level, quantile, radius, distance threshold, number of
    neighbors, stress multiplier, scenario count, or similar hyperparameter
    must be selected using preregistered design/reference data only and
    frozen before evaluation outcomes are inspected.
  severity_search_on_phase3_holdout: forbidden

scenario_count_governance:
  count_defined_here: false
  finite_or_continuous_set_allowed_in_principle: true
  requirement: >
    The later executable contract must declare whether U is enumerated,
    sampled, or represented implicitly, and must define deterministic
    reproduction rules where randomness is used.
  random_seed_required_if_stochastic: true
  adaptive_more_scenarios_after_bad_result: forbidden

nominal_state_policy:
  inclusion_status: not_yet_decided
  requirement: >
    A later instantiation contract must state explicitly whether U contains
    a nominal or reference state and how that state is constructed. It may
    not be added or removed after observing Phase-3 evaluation results.

scenario_probabilities:
  status: out_of_scope_for_mm0
  reason: >
    MM0 is a worst-case max-min experiment. Introducing probabilities
    would create an expected-utility or distributionally weighted problem
    and confound the first robustness test.
  weighted_expectation_objective: forbidden

historical_event_extension:
  status: reserved_for_later_ablation
  scientific_vision: >
    A later Phase-3 line may use a Transformer/event-sequence representation
    and historical retrieval to construct an empirically grounded U(Z_H).
    Such a model must obey this same information, action-independence,
    boundedness, target-space, and holdout-separation contract.
  mm0_requirement: >
    The first executable MinMax uncertainty-set instantiation must not
    silently introduce the Transformer/event-history extension. Its
    incremental contribution must remain separately testable.

invalid_uncertainty_sets:
  - uses_phase3_evaluation_outcomes_to_set_scenario_rules
  - uses_phase3_evaluation_outcomes_to_set_severity
  - scenario_depends_on_challenger_selected_indices
  - scenario_depends_on_challenger_veto_mask
  - gives_champion_and_challenger_different_worlds
  - permits_unbounded_negative_candidate_values
  - mixes_raw_returns_with_target_model_units
  - omits_values_for_candidates_that_can_enter_admissible_actions
  - changes_phase2_models_or_calibration
  - changes_phase2_ranking_or_p10_threshold
  - changes_topk_fraction
  - uses_probability_weighted_expected_value_as_mm0_objective
  - retrospectively_adds_scenarios_after_seeing_holdout_results
  - retrospectively_removes_scenarios_that_hurt_the_method

falsifiability:
  principle: >
    Once U is concretely instantiated and frozen, a negative or zero
    robust result is a valid Phase-3 outcome. The uncertainty set may not
    be modified merely because Gamma fails to exceed zero or because
    realized decision value fails to improve.
  failed_hypothesis_retention: required

required_next_contract:
  id_placeholder: DTRM_PHASE3_MM0_UNCERTAINTY_INSTANTIATION
  purpose: >
    Choose one concrete, minimal uncertainty-construction mechanism for
    the strict MM0 experiment while satisfying this structural Binding D.
  must_freeze_before_execution:
    - approved_data_sources
    - scenario_construction_formula
    - target_space_mapping
    - boundedness_rule
    - severity_or_radius_parameters
    - scenario_count_or_representation
    - random_seed_if_applicable
    - nominal_state_policy
    - feasibility_checks
  explicitly_not_part_of_binding_D:
    - actual_shock_values
    - actual_scenario_vectors
    - historical_neighbors
    - transformer_embeddings
    - minmax_solution
    - holdout_results

implementation_status:
  scenario_generator: blocked_until_instantiation_contract
  minmax_search: blocked_until_instantiation_contract
  phase3_holdout_evaluation: blocked

gate_3_4_binding_D:
  status: pass_for_structure
  prerequisites_satisfied:
    - binding_A_information_state_defined
    - binding_B_action_set_defined
    - binding_C_value_function_defined
    - uncertainty_information_firewall_defined
    - action_independence_defined
    - same_world_comparison_defined
    - boundedness_required
    - holdout_separation_required
  permits:
    - design_of_minimal_MM0_uncertainty_instantiation_contract
    - deterministic_adapter_design_for_A_B_C
  does_not_permit:
    - concrete_scenario_generation
    - minmax_optimization
    - phase3_holdout_outcome_inspection
    - transformer_event_extension
