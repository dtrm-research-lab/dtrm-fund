name: Phase IV evidence adequacy v1 gates

on:
  push:
    branches: ['feature/phase4-evidence-adequacy-audit-v1*']
  pull_request:
    branches: ['research/phase4-temporal-state']

permissions:
  contents: read

jobs:
  evidence-adequacy-v1:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      MYPYPATH: src
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scoped quality tools
        run: python -m pip install --upgrade pytest ruff mypy
      - name: Lint evidence adequacy v1
        run: python -m ruff check --select E4,E7,E9,F,I src/dtrm/phase4/prospective_evidence_adequacy.py research/experiments/validate_phase4_prospective_evidence_adequacy.py tests/test_phase4_prospective_evidence_adequacy.py
      - name: Format evidence adequacy v1
        run: python -m ruff format --check src/dtrm/phase4/prospective_evidence_adequacy.py research/experiments/validate_phase4_prospective_evidence_adequacy.py tests/test_phase4_prospective_evidence_adequacy.py
      - name: Type check evidence adequacy v1
        run: python -m mypy --strict src/dtrm/phase4/prospective_evidence_adequacy.py research/experiments/validate_phase4_prospective_evidence_adequacy.py
      - name: Test evidence adequacy v1
        run: python -m pytest -q tests/test_phase4_prospective_evidence_adequacy.py
      - name: Reproduce evidence adequacy synthetic report
        run: |
          python research/experiments/validate_phase4_prospective_evidence_adequacy.py --output /tmp/phase4-evidence-adequacy.json
          cmp /tmp/phase4-evidence-adequacy.json research/reports/DTRM_PHASE4_PROSPECTIVE_EVIDENCE_ADEQUACY_SYNTHETIC_V1.json
      - name: Preserve inherited Phase III source
        run: python research/experiments/validate_phase4_source_preservation.py
