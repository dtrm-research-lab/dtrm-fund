name: Phase IV gates

on:
  push:
    branches: ['feature/phase4-*', 'research/phase4-temporal-state']
  pull_request:
    branches: ['research/phase4-temporal-state']

permissions:
  contents: read

jobs:
  ontology:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      MYPYPATH: src
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime and scoped quality tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r research/configs/phase4_quality_requirements.txt
          python -m pip install -r research/configs/phase4_source_audit_requirements.txt
          python -m pip install numpy pandas scipy xgboost
      - name: Check inherited source and original contract
        run: python research/experiments/validate_phase4_source_preservation.py
      - name: Lint Phase IV
        run: python -m ruff check --select E4,E7,E9,F,I src/dtrm/phase4 tests/test_phase4_*.py research/experiments/run_phase4_*.py research/experiments/validate_phase4_*.py
      - name: Type check Phase IV
        run: python -m mypy --strict src/dtrm/phase4 research/experiments/run_phase4_*.py research/experiments/validate_phase4_*.py
      - name: Deterministic tests and inherited regressions
        run: python -m pytest -q
      - name: Reproduce synthetic ontology review
        run: |
          python research/experiments/run_phase4_ontology_review.py --input tests/fixtures/phase4_event_batch_v0.json --output /tmp/phase4-ontology-review.json
          cmp /tmp/phase4-ontology-review.json research/reports/DTRM_PHASE4_ONTOLOGY_SYNTHETIC_REVIEW_V0.json
      - name: Reproduce synthetic source metadata inventory
        run: |
          python research/experiments/run_phase4_source_metadata_audit.py --synthetic-input tests/fixtures/phase4_source_metadata_aggregate_v0.json --output /tmp/phase4-source-metadata.json
          cmp /tmp/phase4-source-metadata.json research/reports/DTRM_PHASE4_SOURCE_METADATA_SYNTHETIC_V0.json
      - name: Validate pinned collector lineage evidence
        run: python research/experiments/validate_phase4_collector_lineage.py
      - name: Reproduce synthetic source feasibility report
        run: |
          python research/experiments/run_phase4_source_feasibility.py --synthetic-input tests/fixtures/phase4_source_feasibility_v0.json --output /tmp/phase4-source-feasibility.json
          cmp /tmp/phase4-source-feasibility.json research/reports/DTRM_PHASE4_SOURCE_FEASIBILITY_SYNTHETIC_V0.json
      - name: Reproduce synthetic retrospective salvage report
        run: |
          python research/experiments/run_phase4_retrospective_salvage.py --synthetic-input tests/fixtures/phase4_retrospective_salvage_v0.json --output /tmp/phase4-retrospective-salvage.json
          cmp /tmp/phase4-retrospective-salvage.json research/reports/DTRM_PHASE4_RETROSPECTIVE_SALVAGE_SYNTHETIC_V0.json
      - name: Reproduce synthetic prospective capture review
        run: |
          python research/experiments/run_phase4_prospective_capture_review.py --input tests/fixtures/phase4_prospective_capture_bundle_v0.json --output /tmp/phase4-prospective-capture.json
          cmp /tmp/phase4-prospective-capture.json research/reports/DTRM_PHASE4_PROSPECTIVE_CAPTURE_SYNTHETIC_V0.json
      - name: Validate prospective deployment contract
        run: |
          python research/experiments/validate_phase4_prospective_deployment.py --output /tmp/phase4-prospective-deployment.json
          cmp /tmp/phase4-prospective-deployment.json research/reports/DTRM_PHASE4_PROSPECTIVE_DEPLOYMENT_SYNTHETIC_V0.json
      - name: Validate prospective activation readiness
        run: |
          python research/experiments/validate_phase4_prospective_activation_readiness.py --output /tmp/phase4-prospective-activation-readiness.json
          cmp /tmp/phase4-prospective-activation-readiness.json research/reports/DTRM_PHASE4_PROSPECTIVE_ACTIVATION_READINESS_SYNTHETIC_V0.json
      - name: Build package in disposable source copy
        run: |
          phase4_build_dir=$(mktemp -d)
          git archive HEAD | tar -x -C "$phase4_build_dir"
          python -m build --wheel --no-isolation --outdir /tmp/phase4-dist "$phase4_build_dir"
      - name: Recheck frozen source after all gates
        run: python research/experiments/validate_phase4_source_preservation.py

  synthetic-mongo:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7.0.14
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: '1'
      PHASE4_SYNTHETIC_MONGO: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test-only dependencies
        run: python -m pip install pytest -r research/configs/phase4_source_audit_requirements.txt
      - name: Functional Mongo tests with synthetic records only
        run: python -m pytest -q tests/test_phase4_source_feasibility_mongo.py tests/test_phase4_salvage_live_mongo.py
