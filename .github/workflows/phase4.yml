name: Phase IV gates

on:
  push:
    branches: ['feature/phase4-*', 'research/phase4-temporal-state']
  pull_request:
    branches: ['research/phase4-temporal-state']

permissions:
  contents: read

jobs:
  ontology:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      MYPYPATH: src
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime and scoped quality tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r research/configs/phase4_quality_requirements.txt
          python -m pip install numpy pandas scipy xgboost
      - name: Check inherited source and original contract
        run: python research/experiments/validate_phase4_source_preservation.py
      - name: Lint Phase IV
        run: python -m ruff check --select E4,E7,E9,F,I src/dtrm/phase4 tests/test_phase4_event_ontology.py research/experiments/run_phase4_ontology_review.py research/experiments/validate_phase4_source_preservation.py
      - name: Type check Phase IV
        run: python -m mypy --strict src/dtrm/phase4 research/experiments/run_phase4_ontology_review.py research/experiments/validate_phase4_source_preservation.py
      - name: Deterministic tests and inherited regressions
        run: python -m pytest -q
      - name: Reproduce synthetic ontology review
        run: |
          python research/experiments/run_phase4_ontology_review.py --input tests/fixtures/phase4_event_batch_v0.json --output /tmp/phase4-ontology-review.json
          cmp /tmp/phase4-ontology-review.json research/reports/DTRM_PHASE4_ONTOLOGY_SYNTHETIC_REVIEW_V0.json
      - name: Build package in disposable source copy
        run: |
          phase4_build_dir=$(mktemp -d)
          git archive HEAD | tar -x -C "$phase4_build_dir"
          python -m build --wheel --no-isolation --outdir /tmp/phase4-dist "$phase4_build_dir"
      - name: Recheck frozen source after all gates
        run: python research/experiments/validate_phase4_source_preservation.py
