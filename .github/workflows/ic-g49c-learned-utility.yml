name: IC G4.9c Learned Policy Synthetic Holdout — No Humans

on:
  push:
    branches:
      - research/ic-g4-9c-authority-utility-20261028
  workflow_dispatch:

permissions:
  contents: read

jobs:
  g49c-synthetic-utility:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project dependencies (numpy)
        run: |
          set -euo pipefail
          python -m pip install -e .
      - name: Test G4.9c no-leakage learned policy benchmark
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_ic_g49c_*.py' -v
      - name: Execute all holdout tasks; retain aggregate only
        run: |
          set -euo pipefail
          mkdir -p out
          python research/reviews/icomputing_2026/g49c/g49c_run.py \
            --out out/G49C_SYNTHETIC_LEARNED_POLICY_AGGREGATE.json \
            | tee out/G49C_SYNTHETIC_READOUT.txt
          grep -q '^G49C_LEARNED_POLICY_SYNTHETIC_HOLDOUT_TECHNICAL_PASS$' out/G49C_SYNTHETIC_READOUT.txt
          grep -q '^HUMAN_N=0 NONINFERIORITY=NOT_TESTED
          sha256sum \
            research/reviews/icomputing_2026/g49c/G49C_0_PREEXECUTION_PROTOCOL.md \
            research/reviews/icomputing_2026/g49c/g49c_agent.py \
            research/reviews/icomputing_2026/g49c/g49c_world.py \
            research/reviews/icomputing_2026/g49c/g49c_run.py \
            research/reviews/icomputing_2026/g49c/g49c_participant.py \
            research/reviews/icomputing_2026/g49c/g49c_readback.py \
            out/G49C_SYNTHETIC_LEARNED_POLICY_AGGREGATE.json > out/SOURCE_REPORT_HASHES.txt
      - name: Upload only synthetic aggregate
        uses: actions/upload-artifact@v4
        with:
          name: G49C-SYNTHETIC-LEARNED-UTILITY-NOT-HUMAN-EVIDENCE
          path: out/
          retention-days: 30
 out/G49C_SYNTHETIC_READOUT.txt
          test ! -d research/local_data/g49c_participants
          sha256sum \
            research/reviews/icomputing_2026/g49c/G49C_0_PREEXECUTION_PROTOCOL.md \
            research/reviews/icomputing_2026/g49c/g49c_agent.py \
            research/reviews/icomputing_2026/g49c/g49c_world.py \
            research/reviews/icomputing_2026/g49c/g49c_run.py \
            out/G49C_SYNTHETIC_LEARNED_POLICY_AGGREGATE.json > out/SOURCE_REPORT_HASHES.txt
      - name: Upload only synthetic aggregate
        uses: actions/upload-artifact@v4
        with:
          name: G49C-SYNTHETIC-LEARNED-UTILITY-NOT-HUMAN-EVIDENCE
          path: out/
          retention-days: 30
