name: Phase IV temporal evidence v1 gates

on:
  push:
    branches: ['feature/phase4-prospective-temporal-evidence-v1-*']
  pull_request:
    branches: ['research/phase4-temporal-state']

permissions:
  contents: read

jobs:
  temporal-evidence-v1:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      MYPYPATH: src
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scoped quality tools
        run: python -m pip install --upgrade pytest ruff mypy
      - name: Lint temporal evidence v1
        run: python -m ruff check --select E4,E7,E9,F,I src/dtrm/phase4/prospective_temporal_evidence.py research/experiments/validate_phase4_prospective_temporal_evidence.py tests/test_phase4_prospective_temporal_evidence.py
      - name: Type check temporal evidence v1
        run: python -m mypy --strict src/dtrm/phase4/prospective_temporal_evidence.py research/experiments/validate_phase4_prospective_temporal_evidence.py
      - name: Test temporal evidence v1
        run: python -m pytest -q tests/test_phase4_prospective_temporal_evidence.py
      - name: Reproduce temporal evidence v1 synthetic report
        run: |
          python research/experiments/validate_phase4_prospective_temporal_evidence.py --output /tmp/phase4-prospective-temporal-evidence.json
          cmp /tmp/phase4-prospective-temporal-evidence.json research/reports/DTRM_PHASE4_PROSPECTIVE_TEMPORAL_EVIDENCE_SYNTHETIC_V1.json
      - name: Preserve inherited Phase III source
        run: python research/experiments/validate_phase4_source_preservation.py
